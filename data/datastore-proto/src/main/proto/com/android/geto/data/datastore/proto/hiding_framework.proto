syntax = "proto3";

option java_package = "com.android.geto.data.datastore.proto";
option java_multiple_files = true;

// Which settings a launch hides. Half of what NotificationFunctionProto used to decide on
// its own - the other half is UnhidingFrameworkProto, and the whole point of v3's split is
// that the two questions are independent.
//
// Zero is "not chosen", the same shape as ShizukuForkModeProto and NotificationFunctionProto
// before it, so which framework an install that has never opened the picker gets is decided
// in the domain rather than baked into a wire format. It also lets
// MigrateFrameworksUseCase tell "never migrated" from "deliberately chose IMD defaults".
enum HidingFrameworkProto {
  HidingFrameworkUnset = 0;
  HidingFrameworkImdDefaults = 1;
  HidingFrameworkPerApp = 2;
}
