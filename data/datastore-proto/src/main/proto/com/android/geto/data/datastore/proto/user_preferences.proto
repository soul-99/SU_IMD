syntax = "proto3";

import "com/android/geto/data/datastore/proto/theme.proto";
import "com/android/geto/data/datastore/proto/sort_launcher_apps_activity_info.proto";
import "com/android/geto/data/datastore/proto/sort_order_launcher_apps_activity_info.proto";
import "com/android/geto/data/datastore/proto/sort_favourite_apps.proto";
import "com/android/geto/data/datastore/proto/favourite_apps_view.proto";
import "com/android/geto/data/datastore/proto/shizuku_fork_mode.proto";
import "com/android/geto/data/datastore/proto/notification_function.proto";

option java_package = "com.android.geto.data.datastore.proto";
option java_multiple_files = true;

message UserPreferences {
  ThemeProto theme = 1;
  bool dynamicTheme = 2;
  SortLauncherAppsActivityInfoProto sortLauncherAppsActivityInfo = 3;
  SortOrderLauncherAppsActivityInfoProto sortOrderLauncherAppsActivityInfo = 4;
  bool showSystem = 5;

  // ---- suIMD additions ----

  // Component names ("pkg/Activity") marked as favourite, in custom order.
  repeated string favouriteComponentNames = 6;
  SortFavouriteAppsProto sortFavouriteApps = 7;
  FavouriteAppsViewProto favouriteAppsView = 8;

  // Restart Shizuku after a revert puts back the USB debugging that took its service down.
  //
  // Only meaningful when restartShizukuSet below is true. A proto3 bool cannot tell "the
  // user switched this off" from "the user has never seen it", and those need to differ now
  // that the answer to the second one is on rather than off.
  bool restartShizuku = 10;
  // Auth token from Shizuku's "View intents" screen.
  string shizukuAuthKey = 11;
  // Shizuku's package name. Configurable because stealth mode renames it.
  string shizukuPackageName = 12;
  // Start action from Shizuku's "View intents" screen. Blank means derive it as
  // "<shizukuPackageName>.START", which is right unless a rename left the action
  // pointing at the original package.
  string shizukuStartAction = 15;

  // Accessibility services the user chose to have suIMD disable when a
  // "Hide Accessibility Services" app setting is applied.
  repeated string managedAccessibilityServices = 13;
  // Which accessibility services each target app currently holds switched off, keyed
  // by that app's component name; the value is a ":"-joined list of flattened service
  // component names.
  //
  // Per-app rather than one global list: with a single shared list, reverting app A
  // switches services back on while app B is still in the foreground relying on them
  // being off, and B's own revert then finds nothing to do. Keyed by app, a service is
  // only re-enabled once no app is still holding it down.
  map<string, string> heldAccessibilityServices = 16;

  // Which items the manual "Revert settings" dialog on the Favourites tab had ticked
  // when it was last used, stored as ManualRevertTarget enum names. Empty means the
  // dialog has never been used, which the domain reads as "all of them".
  repeated string manualRevertTargets = 17;

  // What each setting was really set to just before an app's profile was applied, keyed
  // by that app's component name and encoded by SettingSnapshot. Reverting writes these
  // back rather than the "value on revert" the user typed, so a profile that hides
  // developer options cannot switch them on for someone who had them off already.
  map<string, string> settingStateBefore = 18;

  // Whether the one-time tip shown after setup has been seen.
  bool tipShown = 19;

  // Which family of Shizuku fork the start broadcast is aimed at. Decides whether an
  // auth key is part of the contract at all, so it cannot be inferred from the other
  // fields.
  ShizukuForkModeProto shizukuForkMode = 20;

  // Whether the one-time "use Obtainium for updates" note has been dismissed. Its own
  // flag rather than a reuse of tipShown, so upgrading into this version shows it to
  // people who saw the earlier tip long ago — they are exactly who needs telling.
  bool obtainiumTipShown = 21;

  // Whether the notification posted after a launch reverts what that one app changed, or
  // drives the whole device back to revertDefaults below.
  NotificationFunctionProto notificationFunction = 22;

  // The state each target should be left in when "Revert to default" runs, one entry per
  // target encoded by RevertDefaults as "<Name>=0" or "<Name>=1".
  //
  // A state per target rather than a list of names to switch on: an absent name could not
  // tell "the user wants this left off" apart from "not configured yet", and those have to
  // behave differently — the first is a decision, the second falls back to RevertDefaults.Default.
  repeated string revertDefaults = 23;

  // Whether the last attempt to start the Shizuku service timed out without it coming up.
  //
  // Persisted rather than held in memory because most attempts happen with no UI on screen —
  // a revert from a tile or a notification — and the failure has to survive until the
  // settings manager is next opened, which is the only place it can be reported.
  bool shizukuStartFailed = 24;

  // The app version that last showed the setup reminders page.
  //
  // A version rather than a "seen it" flag, so an update can put the page in front of people
  // who were set up long ago — which is the whole point of it: the reminders are about
  // configuration that changes between releases, and someone who finished setup two versions
  // ago has never read the current ones. Zero means it has never been shown.
  int32 setupNoticeVersion = 25;

  // Which targets are switched off when an app is launched, encoded by SettingsToHide the
  // same way as revertDefaults above.
  //
  // Device-wide rather than per app: the settings a locked-down app objects to are the same
  // four whichever app it is, and requiring a profile per app before any app could be
  // opened was the largest thing between installing this and using it. The per-app profiles
  // still exist and are what the memory notification function reads.
  repeated string settingsToHide = 27;

  // Whether the one-time v1.6 reset of the notification function has run.
  //
  // v1.6 moves the whole app onto one device-wide "Settings to hide" configuration, and the
  // memory function is now the deliberate exception rather than the thing an upgrade lands
  // you in. An install carrying the old default forward would find every launch reading a
  // per-app profile it has never written. False for every install that predates this field,
  // so the reset happens once and a later switch back to the memory function sticks.
  bool notificationFunctionResetV16 = 28;

  // Whether restartShizuku above holds an actual decision.
  //
  // False for every install that predates this field, including one that has the toggle
  // switched on — which reads the same either way, since an unset restartShizuku now
  // defaults to on. Only someone deliberately switching it off is affected, and only once.
  bool restartShizukuSet = 26;

  // 9 was favouriteAppsTapAction. What a tap and a long press do is now decided by the
  // notification function rather than chosen, so there is nothing left for it to store.
  // 14 was a single global suspended-services list, replaced by the map above.
  reserved 9, 14;
}
