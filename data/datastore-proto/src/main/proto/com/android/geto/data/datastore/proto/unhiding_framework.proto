syntax = "proto3";

option java_package = "com.android.geto.data.datastore.proto";
option java_multiple_files = true;

// How a hide is undone. The other half of the old NotificationFunctionProto.
//
// Zero is "not chosen", for the same reason as HidingFrameworkProto: the recommendation
// moved once already - v1.6 steered people to Revert to default, v3 steers new installs to
// the memory function - and a default that lives in the domain can move again without a
// renumbering or a migration.
enum UnhidingFrameworkProto {
  UnhidingFrameworkUnset = 0;
  UnhidingFrameworkMemory = 1;
  UnhidingFrameworkRevertToDefault = 2;
}
