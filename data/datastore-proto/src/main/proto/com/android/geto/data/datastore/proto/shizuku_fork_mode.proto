syntax = "proto3";

option java_package = "com.android.geto.data.datastore.proto";
option java_multiple_files = true;

// Zero has to mean "not chosen yet": proto3 cannot tell an unset enum from one
// explicitly set to its first value, and defaulting to either fork would leave an
// upgraded install pointed at a contract it may not speak.
enum ShizukuForkModeProto {
  ShizukuForkUnset = 0;
  ShizukuForkThedjchi = 1;
  ShizukuForkOther = 2;
}
